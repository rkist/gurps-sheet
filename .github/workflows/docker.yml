name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Weekly rebuild, so the published image picks up node:24-alpine security fixes.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build
        run: docker build --pull -t gurps-sheet:test .

      - name: Start it with the same restrictions as compose.yaml
        run: >-
          docker run -d --name gurps-sheet -p 8080:8080
          --read-only --cap-drop ALL --security-opt no-new-privileges
          gurps-sheet:test

      - name: Wait for the health check
        run: |
          for _ in $(seq 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' gurps-sheet)
            [ "$status" = healthy ] && exit 0
            sleep 1
          done
          echo "Health status after 60s: $status"
          exit 1

      - name: End-to-end tests against the container
        run: npm test
        env:
          TEST_URL: http://127.0.0.1:8080/

      - name: Stops promptly on SIGTERM
        run: |
          start=$(date +%s)
          docker stop gurps-sheet
          elapsed=$(( $(date +%s) - start ))
          echo "Stopped in ${elapsed}s"
          [ "$elapsed" -lt 5 ]

      - name: Container logs
        if: always()
        run: docker logs gurps-sheet

  publish:
    name: Publish to GHCR
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
